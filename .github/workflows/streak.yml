name: Update current streak

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build current streak card
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = await github.graphql(`
              query ($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `, { login: context.repo.owner });

            const calendar = result.user.contributionsCollection.contributionCalendar;
            const days = calendar.weeks.flatMap((week) => week.contributionDays);
            let streak = 0;
            let latestContribution = 'No contributions yet';

            for (let index = days.length - 1; index >= 0; index -= 1) {
              const day = days[index];
              if (day.contributionCount === 0) {
                if (streak > 0) break;
                continue;
              }
              if (streak === 0) latestContribution = day.date;
              streak += 1;
            }

            const label = streak === 1 ? 'DAY' : 'DAYS';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title description">
              <title id="title">Current GitHub contribution streak</title>
              <desc id="description">${streak} day contribution streak, last active on ${latestContribution}.</desc>
              <rect width="900" height="180" rx="14" fill="#0d1117"/>
              <rect x="1" y="1" width="898" height="178" rx="13" fill="none" stroke="#263243"/>
              <text x="42" y="49" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="700">CURRENT CONTRIBUTION STREAK</text>
              <text x="42" y="77" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Live from Samarth's public GitHub activity</text>
              <text x="42" y="139" fill="#f97316" font-family="Arial, sans-serif" font-size="57" font-weight="700">${streak}</text>
              <text x="151" y="137" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" font-weight="700">${label}</text>
              <text x="650" y="71" fill="#22d3ee" font-family="Arial, sans-serif" font-size="15" font-weight="700">${calendar.totalContributions} CONTRIBUTIONS</text>
              <text x="650" y="98" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Last active: ${latestContribution}</text>
              <circle cx="826" cy="132" r="12" fill="#22d3ee">
                <animate attributeName="r" values="9;15;9" dur="1.3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values=".4;1;.4" dur="1.3s" repeatCount="indefinite"/>
              </circle>
              <path d="M650 132 H790" stroke="#f97316" stroke-width="3" stroke-linecap="round" pathLength="100">
                <animate attributeName="stroke-dasharray" values="0 100;100 0" dur="2.2s" repeatCount="indefinite"/>
              </path>
            </svg>`;

            fs.writeFileSync('assets/current-streak.svg', svg);

      - name: Commit updated streak
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update current contribution streak"
          file_pattern: assets/current-streak.svg
