<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title description">
  <title id="title">Current GitHub contribution streak</title>
  <desc id="description">11 day contribution streak, last active on 2026-07-30.</desc>
  <rect width="900" height="180" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="178" rx="13" fill="none" stroke="#263243"/>
  <text x="42" y="49" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="700">CURRENT CONTRIBUTION STREAK</text>
  <text x="42" y="77" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Live from Samarth's public GitHub activity</text>
  <text x="42" y="139" fill="#f97316" font-family="Arial, sans-serif" font-size="57" font-weight="700">11</text>
  <text x="151" y="137" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22" font-weight="700">DAYS</text>
  <text x="650" y="71" fill="#22d3ee" font-family="Arial, sans-serif" font-size="15" font-weight="700">85 CONTRIBUTIONS</text>
